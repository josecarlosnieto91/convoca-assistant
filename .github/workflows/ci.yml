name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  php-lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-dev

      - name: PHP lint
        run: find . -name '*.php' -not -path './vendor/*' -exec php -l {} \;

  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: PHPCS
        run: vendor/bin/phpcs --standard=dev-tools/phpcs.xml.dist --runtime-set ignore_warnings_on_exit 1 || true

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: PHPStan
        run: vendor/bin/phpstan analyse --configuration=dev-tools/phpstan.neon.dist --memory-limit=4G || true
