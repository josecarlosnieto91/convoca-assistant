name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  php-lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-dev

      - name: PHP lint
        run: find . -name '*.php' -not -path './vendor/*' -exec php -l {} \;

  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      # PHPCS bloqueante: 0 errores (warnings permitidos vía ignore_warnings_on_exit).
      - name: PHPCS
        run: vendor/bin/phpcs --standard=dev-tools/phpcs.xml.dist --runtime-set ignore_warnings_on_exit 1

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: PHPStan
        run: vendor/bin/phpstan analyse --configuration=dev-tools/phpstan.neon.dist --memory-limit=4G

  plugin-check:
    name: Plugin Check (PCP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
          composer-options: '--ignore-platform-req=ext-iconv'
      - name: Build clean plugin dir (as published)
        # Replica el paquete de distribución: excluye tooling dev (.distignore)
        # y archivos ocultos/prohibidos (.htaccess). vendor viaja (wp.org no
        # ejecuta composer y PCP activa el plugin en wp-env).
        run: |
          mkdir -p build-dir
          rsync -a --exclude-from=.distignore ./ build-dir/convoca-assistant/
          cp -r vendor build-dir/convoca-assistant/
          find build-dir/convoca-assistant -name '.htaccess' -delete
          ls build-dir/convoca-assistant/
      - name: Run Plugin Check (WordPress.org)
        # Ejecuta Plugin Check (PCP) en categorías plugin_repo + security,
        # bloqueantes para publicar en WordPress.org. Los warnings no fallan;
        # cualquier ERROR sí (exit != 0).
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build-dir/convoca-assistant'
          categories: |
            plugin_repo
            security
          ignore-warnings: 'true'
          wp-version: latest

  test:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite unit
